<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MP4循环播放器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1a2a6c, #2c3e50);
      color: white;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      animation: fadeInDown 1s ease;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      background: linear-gradient(to right, #00c6ff, #0072ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1.2rem;
      opacity: 0.8;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .player-container {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      margin-bottom: 30px;
      animation: fadeInUp 1s ease;
    }

    .video-wrapper {
      position: relative;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 25px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    #videoPlayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 12px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: space-between;
      margin-top: 20px;
    }

    .control-group {
      flex: 1;
      min-width: 250px;
      background: rgba(0, 0, 0, 0.3);
      padding: 20px;
      border-radius: 12px;
    }

    .control-title {
      font-size: 1.3rem;
      margin-bottom: 15px;
      color: #4fc3f7;
      display: flex;
      align-items: center;
    }

    .control-title i {
      margin-right: 10px;
      font-size: 1.5rem;
    }

    .control-item {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input, select, button {
      width: 100%;
      padding: 12px 15px;
      border-radius: 8px;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: white;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    input:focus, select:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 0 2px #4fc3f7;
    }

    select {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 15px center;
      background-size: 16px;
    }

    button {
      background: linear-gradient(to right, #00c6ff, #0072ff);
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 114, 255, 0.6);
    }

    .status {
      background: rgba(0, 0, 0, 0.3);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      animation: fadeIn 1.5s ease;
    }

    .current-video {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 15px 0;
      color: #4fc3f7;
      text-shadow: 0 0 10px rgba(79, 195, 247, 0.5);
      animation: pulse 2s infinite;
    }

    .video-url {
      font-size: 1.1rem;
      word-break: break-all;
      opacity: 0.9;
      margin-top: 10px;
      line-height: 1.6;
    }

    .counter {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .counter-item {
      background: rgba(0, 0, 0, 0.4);
      padding: 15px 25px;
      border-radius: 10px;
      min-width: 150px;
    }

    .counter-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: #00e676;
    }

    .counter-label {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 5px;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      padding: 20px;
      font-size: 0.9rem;
      opacity: 0.7;
      animation: fadeIn 2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% { text-shadow: 0 0 10px rgba(79, 195, 247, 0.5); }
      50% { text-shadow: 0 0 20px rgba(79, 195, 247, 0.8); }
      100% { text-shadow: 0 0 10px rgba(79, 195, 247, 0.5); }
    }

    @media (max-width: 768px) {
      .controls {
        flex-direction: column;
      }

      h1 {
        font-size: 2.2rem;
      }

      .counter-item {
        min-width: 120px;
      }

      .counter-value {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>MP4循环播放器</h1>
    <p class="subtitle">自动循环播放指定范围内的MP4视频，支持自定义起始位置和播放速度</p>
  </header>

  <div class="player-container">
    <div class="video-wrapper">
      <video id="videoPlayer" controls autoplay>
        您的浏览器不支持HTML5视频播放
      </video>
    </div>

    <div class="controls">
      <div class="control-group">
        <h3 class="control-title">播放设置</h3>

        <div class="control-item">
          <label for="startGroup">起始组号 (100为一组)</label>
          <input type="number" id="startGroup" min="1" max="10" value="1">
          <small>输入1-10之间的数字，1表示100-199，10表示1000</small>
        </div>

        <div class="control-item">
          <label for="playbackSpeed">播放速度</label>
          <select id="playbackSpeed">
            <option value="0.5">0.5x (慢速)</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x (正常)</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x (快速)</option>
          </select>
        </div>

        <button id="startBtn">开始播放</button>
      </div>

      <div class="control-group">
        <h3 class="control-title">播放控制</h3>

        <div class="control-item">
          <label for="currentVideo">当前视频编号</label>
          <input type="number" id="currentVideo" min="100" max="1000" value="100">
        </div>

        <div class="control-item">
          <label for="jumpToVideo">跳转到视频</label>
          <input type="number" id="jumpToVideo" min="100" max="1000" placeholder="输入100-1000之间的数字">
        </div>

        <button id="jumpBtn">跳转播放</button>
      </div>
    </div>
  </div>

  <div class="status">
    <h3 class="control-title">当前播放信息</h3>
    <div class="current-video">视频编号: <span id="currentNumber">100</span></div>
    <div class="video-url">视频地址:
      <span id="videoUrl">http://www.hubeixiaoshuya.com/card/video/100.mp4</span>
    </div>

    <div class="counter">
      <div class="counter-item">
        <div class="counter-value" id="playedCount">0</div>
        <div class="counter-label">已播放视频</div>
      </div>
      <div class="counter-item">
        <div class="counter-value" id="remainingCount">901</div>
        <div class="counter-label">剩余视频</div>
      </div>
      <div class="counter-item">
        <div class="counter-value" id="totalCount">901</div>
        <div class="counter-label">总视频数</div>
      </div>
    </div>
  </div>

  <footer>
    <p>MP4循环播放器 &copy; 2023 | 支持视频范围: 100.mp4 到 1000.mp4</p>
  </footer>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 获取DOM元素
        const videoPlayer = document.getElementById('videoPlayer');
        const startGroup = document.getElementById('startGroup');
        const playbackSpeed = document.getElementById('playbackSpeed');
        const startBtn = document.getElementById('startBtn');
        const currentVideo = document.getElementById('currentVideo');
        const jumpToVideo = document.getElementById('jumpToVideo');
        const jumpBtn = document.getElementById('jumpBtn');
        const currentNumber = document.getElementById('currentNumber');
        const videoUrl = document.getElementById('videoUrl');
        const playedCount = document.getElementById('playedCount');
        const remainingCount = document.getElementById('remainingCount');
        const totalCount = document.getElementById('totalCount');

        // 初始化变量
        let currentVideoNumber = 100;
        let totalVideos = 901; // 1000 - 100 + 1
        let playedVideos = 0;

        // 更新计数器显示
        function updateCounters() {
            playedCount.textContent = playedVideos;
            remainingCount.textContent = totalVideos - playedVideos;
            totalCount.textContent = totalVideos;
        }

        // 更新视频播放器
        function playVideo(videoNum) {
            currentVideoNumber = videoNum;
            const videoSrc = `http://www.hubeixiaoshuya.com/card/video/${videoNum}.mp4`;

            videoPlayer.src = videoSrc;
            videoPlayer.playbackRate = parseFloat(playbackSpeed.value);

            // 更新显示
            currentNumber.textContent = videoNum;
            videoUrl.textContent = videoSrc;
            currentVideo.value = videoNum;
        }

        // 播放下一个视频
        function playNextVideo() {
            playedVideos++;

            if (currentVideoNumber >= 1000) {
                currentVideoNumber = 100; // 回到第一个视频
            } else {
                currentVideoNumber++;
            }

            playVideo(currentVideoNumber);
            updateCounters();
        }

        // 开始播放
        function startPlayback() {
            const group = parseInt(startGroup.value);

            if (group < 1 || group > 10) {
                alert('请输入1到10之间的组号');
                return;
            }

            // 计算起始视频编号
            currentVideoNumber = (group - 1) * 100 + 100;
            if (currentVideoNumber > 1000) currentVideoNumber = 1000;

            playedVideos = 0;
            playVideo(currentVideoNumber);
            updateCounters();
        }

        // 事件监听
        startBtn.addEventListener('click', startPlayback);

        playbackSpeed.addEventListener('change', function() {
            videoPlayer.playbackRate = parseFloat(this.value);
        });

        jumpBtn.addEventListener('click', function() {
            const jumpNum = parseInt(jumpToVideo.value);

            if (isNaN(jumpNum)) {
                alert('请输入有效的视频编号');
                return;
            }

            if (jumpNum < 100 || jumpNum > 1000) {
                alert('视频编号必须在100到1000之间');
                return;
            }

            playVideo(jumpNum);
            jumpToVideo.value = '';
        });

        // 视频结束时播放下一个
        videoPlayer.addEventListener('ended', playNextVideo);

        // 当前视频输入变化时跳转
        currentVideo.addEventListener('change', function() {
            const videoNum = parseInt(this.value);

            if (!isNaN(videoNum) && videoNum >= 100 && videoNum <= 1000) {
                playVideo(videoNum);
            }
        });

        // 初始化
        updateCounters();
        playVideo(100);
    });
</script>
</body>
</html>
